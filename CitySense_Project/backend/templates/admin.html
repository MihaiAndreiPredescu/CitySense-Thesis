<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CitySense Admin Dashboard</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #2f241f;
      --muted: #7f7269;
      --accent: #d96c1a;
      --accent-dark: #9f4300;
      --border: #e6ddd3;
      --resolved: #698160;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(217, 108, 26, 0.16), transparent 35%),
        linear-gradient(180deg, #f7f3ed 0%, #f1ece6 100%);
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      padding: 24px;
      border-right: 1px solid var(--border);
      background: rgba(255, 253, 248, 0.92);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
    }

    .eyebrow {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    select,
    button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      font: inherit;
      background: white;
      color: var(--ink);
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .stat-card {
      padding: 14px;
      background: white;
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    .stat-card strong {
      display: block;
      font-size: 1.4rem;
      margin-top: 6px;
    }

    .reports {
      margin-top: 20px;
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 300px);
      overflow: auto;
      padding-right: 4px;
    }

    .report-card {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: white;
      box-shadow: 0 10px 30px rgba(36, 23, 14, 0.06);
    }

    .report-card h2 {
      margin: 0;
      font-size: 1rem;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(217, 108, 26, 0.12);
      color: var(--accent-dark);
    }

    .pill.resolved {
      background: rgba(105, 129, 96, 0.15);
      color: var(--resolved);
    }

    .report-card img {
      width: 100%;
      margin-top: 12px;
      border-radius: 14px;
      display: block;
      object-fit: cover;
      max-height: 180px;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .card-actions button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--border);
    }

    .empty-state {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: white;
      border: 1px dashed var(--border);
      color: var(--muted);
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      #map {
        height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h1>CitySense Ops</h1>
      <p class="eyebrow">
        Monitor pothole reports, merge hotspots, and resolve issues once repairs are completed.
      </p>
      <p class="eyebrow">Detector mode: <strong>{{ detector_mode }}</strong></p>

      <div class="controls">
        <label for="statusFilter">Status filter</label>
        <select id="statusFilter">
          <option value="OPEN" selected>Open reports</option>
          <option value="RESOLVED">Resolved reports</option>
          <option value="ALL">All reports</option>
        </select>
        <button id="refreshButton" type="button">Refresh reports</button>
      </div>

      <div class="stats">
        <div class="stat-card">
          <span>Total shown</span>
          <strong id="totalReports">0</strong>
        </div>
        <div class="stat-card">
          <span>Total upvotes</span>
          <strong id="totalUpvotes">0</strong>
        </div>
      </div>

      <div id="reportList" class="reports"></div>
      <div id="emptyState" class="empty-state" hidden>
        No reports match the current filter yet.
      </div>
    </aside>

    <main id="map"></main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const apiPrefix = "{{ api_prefix }}";
    const statusFilter = document.getElementById("statusFilter");
    const refreshButton = document.getElementById("refreshButton");
    const reportList = document.getElementById("reportList");
    const emptyState = document.getElementById("emptyState");
    const totalReports = document.getElementById("totalReports");
    const totalUpvotes = document.getElementById("totalUpvotes");

    const map = L.map("map").setView([46.770439, 23.591423], 13);
    let markersLayer = L.layerGroup().addTo(map);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    function formatDateTime(value) {
      if (!value) {
        return "Not recorded";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "Not recorded";
      }

      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(date);
    }

    function popupHtml(report) {
      return `
        <strong>${report.issue_type}</strong><br />
        Confidence: ${(report.confidence * 100).toFixed(1)}%<br />
        Upvotes: ${report.upvotes}<br />
        Status: ${report.status}<br />
        Date and time the last photo report was taken: ${formatDateTime(
          report.last_photo_reported_at
        )}<br />
        Coordinates: ${report.latitude.toFixed(5)}, ${report.longitude.toFixed(5)}
      `;
    }

    function markerColor(report) {
      if (report.status === "RESOLVED") {
        return "#698160";
      }

      return report.upvotes >= 3 ? "#c1440e" : "#d96c1a";
    }

    async function updateStatus(reportId, status) {
      const response = await fetch(`${apiPrefix}/reports/${reportId}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ status }),
      });

      if (!response.ok) {
        const payload = await response.json();
        throw new Error(payload.detail || "Unable to update report status.");
      }
    }

    function renderList(reports) {
      reportList.innerHTML = "";
      emptyState.hidden = reports.length > 0;
      totalReports.textContent = String(reports.length);
      totalUpvotes.textContent = String(
        reports.reduce((total, report) => total + report.upvotes, 0)
      );

      for (const report of reports) {
        const card = document.createElement("article");
        card.className = "report-card";

        const badgeClass = report.status === "RESOLVED" ? "pill resolved" : "pill";
        const imageHtml = report.image_url
          ? `<img src="${report.image_url}" alt="Uploaded pothole report image" />`
          : "";

        card.innerHTML = `
          <h2>${report.issue_type.toUpperCase()} · ${report.id.slice(0, 8)}</h2>
          <div class="meta">
            Confidence ${(report.confidence * 100).toFixed(1)}% ·
            ${report.upvotes} upvotes<br />
            Date and time the last photo report was taken:
            ${formatDateTime(report.last_photo_reported_at)}<br />
            ${report.latitude.toFixed(5)}, ${report.longitude.toFixed(5)}
          </div>
          <div class="${badgeClass}">${report.status}</div>
          ${imageHtml}
          <div class="card-actions">
            <button type="button" data-focus="${report.id}">Focus on map</button>
            ${
              report.status === "OPEN"
                ? `<button type="button" class="secondary" data-resolve="${report.id}">Mark resolved</button>`
                : ""
            }
          </div>
        `;

        reportList.appendChild(card);
      }

      reportList.querySelectorAll("[data-focus]").forEach((button) => {
        button.addEventListener("click", () => {
          const report = reports.find((item) => item.id === button.dataset.focus);
          if (!report) return;
          map.setView([report.latitude, report.longitude], 18);
        });
      });

      reportList.querySelectorAll("[data-resolve]").forEach((button) => {
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            await updateStatus(button.dataset.resolve, "RESOLVED");
            await fetchReports();
          } catch (error) {
            alert(error.message);
            button.disabled = false;
          }
        });
      });
    }

    function renderMarkers(reports) {
      markersLayer.clearLayers();

      if (reports.length === 0) {
        return;
      }

      const bounds = [];
      reports.forEach((report) => {
        const marker = L.circleMarker([report.latitude, report.longitude], {
          radius: Math.min(12 + report.upvotes * 2, 26),
          fillColor: markerColor(report),
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.85,
        }).bindPopup(popupHtml(report));

        markersLayer.addLayer(marker);
        bounds.push([report.latitude, report.longitude]);
      });

      if (bounds.length === 1) {
        map.setView(bounds[0], 16);
      } else {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    async function fetchReports() {
      const selectedStatus = statusFilter.value;
      const query =
        selectedStatus === "ALL" ? "" : `?status=${encodeURIComponent(selectedStatus)}`;

      const response = await fetch(`${apiPrefix}/reports${query}`);
      if (!response.ok) {
        throw new Error("Unable to load reports from the backend.");
      }

      const reports = await response.json();
      renderList(reports);
      renderMarkers(reports);
    }

    refreshButton.addEventListener("click", async () => {
      refreshButton.disabled = true;
      try {
        await fetchReports();
      } finally {
        refreshButton.disabled = false;
      }
    });

    statusFilter.addEventListener("change", fetchReports);

    fetchReports().catch((error) => {
      console.error(error);
      emptyState.hidden = false;
      emptyState.textContent = error.message;
    });
  </script>
</body>
</html>
